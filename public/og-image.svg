<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#05080E" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#4187FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#4187FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#4187FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#glow2)" />

  <!-- Grid overlay -->
  <g stroke="#78B4DC" stroke-opacity="0.08" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="320" y1="0" x2="320" y2="630" />
    <line x1="440" y1="0" x2="440" y2="630" />
    <line x1="560" y1="0" x2="560" y2="630" />
    <line x1="680" y1="0" x2="680" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="920" y1="0" x2="920" y2="630" />
    <line x1="1040" y1="0" x2="1040" y2="630" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
  </g>

  <!-- 3D Wireframe Cyber Globe Graphic on Right -->
  <g transform="translate(900, 315)">
    <circle r="190" fill="none" stroke="#15355A" stroke-width="2" opacity="0.6" />
    <circle r="190" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.25" stroke-dasharray="4 6" />
    <ellipse rx="190" ry="70" fill="none" stroke="#4187FF" stroke-width="1.5" opacity="0.4" />
    <ellipse rx="190" ry="130" fill="none" stroke="#15355A" stroke-width="1.2" opacity="0.5" />
    <ellipse rx="70" ry="190" fill="none" stroke="#15355A" stroke-width="1.2" opacity="0.5" />
    <ellipse rx="130" ry="190" fill="none" stroke="#4187FF" stroke-width="1.5" opacity="0.4" />
    <!-- Constellation points -->
    <circle cx="-110" cy="-60" r="5" fill="#00E5FF" />
    <circle cx="40" cy="-120" r="4.5" fill="#00E5FF" />
    <circle cx="120" cy="-30" r="6" fill="#00E5FF" />
    <circle cx="80" cy="90" r="5" fill="#4187FF" />
    <circle cx="-70" cy="110" r="4" fill="#00E5FF" />
    <circle cx="-30" cy="10" r="5" fill="#00E5FF" />
    <circle cx="140" cy="60" r="4" fill="#4187FF" />
    <!-- Connecting lines -->
    <line x1="-110" y1="-60" x2="-30" y2="10" stroke="#00E5FF" stroke-width="1.5" opacity="0.6" />
    <line x1="-30" y1="10" x2="120" y2="-30" stroke="#00E5FF" stroke-width="1.5" opacity="0.6" />
    <line x1="120" y1="-30" x2="40" y2="-120" stroke="#4187FF" stroke-width="1.2" opacity="0.5" />
    <line x1="-30" y1="10" x2="80" y2="90" stroke="#00E5FF" stroke-width="1.5" opacity="0.6" />
    <line x1="80" y1="90" x2="140" y2="60" stroke="#4187FF" stroke-width="1.2" opacity="0.5" />
    <line x1="80" y1="90" x2="-70" y2="110" stroke="#00E5FF" stroke-width="1.2" opacity="0.5" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(100, 110)">
    <!-- Subtitle / Discipline -->
    <text x="0" y="40" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600" fill="#00E5FF" letter-spacing="3">
      DAYANANDA SAGAR COLLEGE OF ENGINEERING · B.E. 2029
    </text>

    <!-- Main Name -->
    <text x="0" y="140" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="78" font-weight="800" fill="#F4F7FB" letter-spacing="-1">
      Yashas B Naik
    </text>

    <!-- Role / Tagline -->
    <text x="0" y="215" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="34" font-weight="600" fill="url(#cyanBlue)">
      Cybersecurity · Software Engineering · AI Systems
    </text>

    <!-- Description -->
    <text x="0" y="280" font-family="'Inter', sans-serif" font-size="22" fill="#9BAAC0">
      Interactive 3D Portfolio featuring PulseGate, Critical Infrastructure Defense,
    </text>
    <text x="0" y="315" font-family="'Inter', sans-serif" font-size="22" fill="#9BAAC0">
      CTF Security Research &amp; Full-Stack Modern Architectures.
    </text>

    <!-- Badges / Metadata row -->
    <g transform="translate(0, 375)">
      <rect x="0" y="0" width="165" height="42" rx="8" fill="#101A2B" stroke="#78B4DC" stroke-opacity="0.3" stroke-width="1" />
      <text x="18" y="27" font-family="'JetBrains Mono', monospace" font-size="15" fill="#00E5FF">CGPA: 8.75 / 10</text>

      <rect x="185" y="0" width="190" height="42" rx="8" fill="#101A2B" stroke="#78B4DC" stroke-opacity="0.3" stroke-width="1" />
      <text x="203" y="27" font-family="'JetBrains Mono', monospace" font-size="15" fill="#F4F7FB">PulseGate Creator</text>

      <rect x="395" y="0" width="220" height="42" rx="8" fill="#101A2B" stroke="#78B4DC" stroke-opacity="0.3" stroke-width="1" />
      <text x="413" y="27" font-family="'JetBrains Mono', monospace" font-size="15" fill="#4187FF">SIH &amp; CTF Competitor</text>
    </g>
  </g>
</svg>
